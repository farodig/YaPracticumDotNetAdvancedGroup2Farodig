global:
  scrape_interval: 15s

scrape_configs:
  - job_name: events-service
    static_configs:
      - targets: ["events-service:8080"]
    metrics_path: /metrics

  - job_name: bookings-service
    static_configs:
      - targets: ["bookings-service:8080"]
    metrics_path: /metrics

  - job_name: persons-service
    static_configs:
      - targets: ["persons-service:8080"]
    metrics_path: /metrics 